watchCluster: true

image:
  registry: registry.gitlab.com
  repository: gitlab-org/cloud-native
  name: gitlab-operator
  # tag: latest
  # digest:
  # pullPolicy: IfNotPresent
  # pullSecrets: []
  prepend: "false"

nameOverride: "gitlab"
fullnameOverride: ""

extraEnvs: []

# bridge is the backend-for-frontend HTTP server that exposes a CRUD API and
# an embedded SPA for configuring GitLab instances. It is disabled by default.
bridge:
  enabled: false
  # port the bridge server listens on inside the container.
  port: 8090

# dynamicChartPull configures how a GitLabCore pulls a GitLab chart version the
# Operator image does not bundle. See doc/developer/gitlabcore.md. It applies
# only when bridge.enabled is set, since GitLabCore runs only with the bridge.
dynamicChartPull:
  # verify checks a pulled chart against its provenance file before it renders.
  # Turn it off only for a mirror that serves no provenance files.
  verify: true
  # trustedKeys are the public keys a pulled chart may be signed with, one
  # ASCII-armored key or keyring (gpg --export --armor) per entry. They are
  # rendered into one keyring in a ConfigMap mounted into the manager, and are
  # the only keys it trusts. The default is the GitLab chart signing key,
  # 5E46F79EF5836E986A663B4AE30F9C687683D663. Helm merges this map with your
  # values: add an entry to trust another key as well, or set
  # gitlab-charts.asc to null to stop trusting the GitLab key. A change takes
  # effect on the next pull, without restarting the manager.
  trustedKeys:
    gitlab-charts.asc: |

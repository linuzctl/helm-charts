---
name: Publish charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**/Chart.yaml"
      - "tracked-charts/**/Chart.yaml"
  workflow_dispatch:
    inputs:
      chart:
        description: "Chart name (leave empty to detect it from the last commit)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  detect-charts:
    name: Detect charts to publish
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.charts.outputs.json }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Build the chart list
        id: charts
        env:
          REQUESTED_CHART: ${{ inputs.chart }}
        run: |
          if [[ -n "$REQUESTED_CHART" ]]; then
            charts_json="$(jq -cn --arg chart "$REQUESTED_CHART" '[$chart]')"
          else
            changed_charts="$(git diff --name-only HEAD~1 HEAD -- 'charts/*/Chart.yaml' 'tracked-charts/*/Chart.yaml' \
              | cut -d/ -f2 \
              | sort -u)"

            charts_json="$(printf '%s\n' "$changed_charts" \
              | jq -Rsc 'split("\n") | map(select(length > 0))')"
          fi

          echo "json=$charts_json" >> "$GITHUB_OUTPUT"
          echo "Charts to publish: $charts_json"

  publish:
    name: Publish ${{ matrix.chart }}
    needs: detect-charts
    if: needs.detect-charts.outputs.charts != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        chart: ${{ fromJSON(needs.detect-charts.outputs.charts) }}

    env:
      CHART_NAME: ${{ matrix.chart }}
      OCI_REGISTRY: ghcr.io
      OCI_REPOSITORY: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Read chart metadata
        run: |
          package_dir="$RUNNER_TEMP/charts"
          release_notes_file="$RUNNER_TEMP/release-notes.md"

          if [[ -f "charts/$CHART_NAME/Chart.yaml" ]]; then
            chart_dir="charts/$CHART_NAME"
          elif [[ -f "tracked-charts/$CHART_NAME/Chart.yaml" ]]; then
            chart_dir="tracked-charts/$CHART_NAME"
          else
            echo "Chart not found: $CHART_NAME" >&2
            exit 1
          fi

          chart_version="$(awk '/^version:/ { print $2; exit }' "$chart_dir/Chart.yaml")"

          if [[ -z "$chart_version" ]]; then
            echo "Chart version not found in $chart_dir/Chart.yaml" >&2
            exit 1
          fi

          {
            echo "CHART_DIR=$chart_dir"
            echo "CHART_VERSION=$chart_version"
            echo "CHART_TAG=$CHART_NAME-$chart_version"
            echo "CHART_PACKAGE=$package_dir/$CHART_NAME-$chart_version.tgz"
            echo "CHART_OCI_REF=oci://$OCI_REPOSITORY/$CHART_NAME"
            echo "PACKAGE_DIR=$package_dir"
            echo "RELEASE_NOTES_FILE=$release_notes_file"
          } >> "$GITHUB_ENV"

          echo "Preparing $CHART_NAME@$chart_version from $chart_dir"

      - name: Log in to GHCR
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" \
            | helm registry login "$OCI_REGISTRY" \
                --username "$GITHUB_ACTOR" \
                --password-stdin

      - name: Check whether this version already exists
        id: published
        run: |
          if helm pull "$CHART_OCI_REF" \
            --version "$CHART_VERSION" \
            --destination "$RUNNER_TEMP" \
            2>/dev/null; then
            echo "$CHART_TAG already exists; skipping publication"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the chart
        if: steps.published.outputs.exists != 'true'
        run: |
          mkdir -p "$PACKAGE_DIR"
          helm package "$CHART_DIR" --destination "$PACKAGE_DIR"

      - name: Push the chart to GHCR
        if: steps.published.outputs.exists != 'true'
        run: |
          helm push "$CHART_PACKAGE" "oci://$OCI_REPOSITORY"
          echo "Published $CHART_OCI_REF:$CHART_VERSION"

      - name: Generate release notes
        if: steps.published.outputs.exists != 'true'
        run: |
          previous_tag="$(git tag \
            --list "$CHART_NAME-*" \
            --sort=-v:refname \
            | head -1)"

          if [[ -n "$previous_tag" ]]; then
            commits="$(git log \
              "$previous_tag..HEAD" \
              --pretty=format:'%h%x09%s' \
              -- "$CHART_DIR/")"
            range_description="since \`$previous_tag\`"
          else
            commits="$(git log \
              --pretty=format:'%h%x09%s' \
              -- "$CHART_DIR/")"
            range_description="full history"
          fi

          {
            echo "## Changes in \`$CHART_DIR/\` ($range_description)"
            echo

            if [[ -n "$commits" ]]; then
              while IFS=$'\t' read -r commit_hash commit_message; do
                linked_message="$(sed -E \
                  "s|#([0-9]+)|[#\1]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/\1)|g" \
                  <<< "$commit_message")"

                printf -- '- [`%s`](%s/%s/commit/%s) %s\n' \
                  "$commit_hash" \
                  "$GITHUB_SERVER_URL" \
                  "$GITHUB_REPOSITORY" \
                  "$commit_hash" \
                  "$linked_message"
              done <<< "$commits"
            else
              echo "_No changes recorded in the chart directory._"
            fi

            echo
            echo "## Install"
            echo
            echo '```console'
            echo "helm pull $CHART_OCI_REF --version $CHART_VERSION"
            echo '```'
          } > "$RELEASE_NOTES_FILE"

      - name: Create the tag and GitHub release
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

          git tag "$CHART_TAG"
          git push origin "$CHART_TAG"

          gh release create "$CHART_TAG" \
            --title "$CHART_NAME $CHART_VERSION" \
            --notes-file "$RELEASE_NOTES_FILE" \
            "$CHART_PACKAGE"

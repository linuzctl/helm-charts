---
name: Extract tracked charts

on:
  pull_request:
    branches:
      - main
    paths:
      - "state/*.yaml"

permissions:
  contents: write
  pull-requests: read

env:
  STATE_FILE_PATTERN: state/*.yaml
  TRACKED_CHARTS_DIR: tracked-charts

defaults:
  run:
    shell: bash

jobs:
  extract:
    name: Extract charts from changed state files
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Find changed state files
        id: state-files
        run: |
          changed_files="$(git diff --name-only origin/main...HEAD -- "$STATE_FILE_PATTERN")"

          chart_names="$(printf '%s\n' "$changed_files" \
            | sed -nE 's|^state/(.+)\.ya?ml$|\1|p' \
            | paste -sd ',' -)"

          {
            echo "files<<EOF"
            echo "$changed_files"
            echo "EOF"
            echo "chart_names=$chart_names"
          } >> "$GITHUB_OUTPUT"

      - name: Download changed charts
        if: steps.state-files.outputs.files != ''
        env:
          CHANGED_STATE_FILES: ${{ steps.state-files.outputs.files }}
        run: |
          extract_dir="$RUNNER_TEMP/extracted-chart"

          while IFS= read -r state_file; do
            [[ -z "$state_file" ]] && continue

            chart_name="$(yq '.chart_name' "$state_file")"
            chart_version="$(yq '.chart_version' "$state_file")"
            repository_name="$(yq '.repo_name' "$state_file")"
            repository_url="$(yq '.repo_url' "$state_file")"

            echo "Downloading $chart_name@$chart_version from $repository_url"

            helm repo add "$repository_name" "$repository_url"
            helm repo update "$repository_name"

            rm -rf "$extract_dir"
            helm pull "$repository_name/$chart_name" \
              --version "$chart_version" \
              --untar \
              --untardir "$extract_dir"

            rm -rf "$TRACKED_CHARTS_DIR/$chart_name"
            cp -R \
              "$extract_dir/$chart_name" \
              "$TRACKED_CHARTS_DIR/$chart_name"
          done <<< "$CHANGED_STATE_FILES"

      - name: Commit extracted charts
        if: steps.state-files.outputs.files != ''
        env:
          CHART_NAMES: ${{ steps.state-files.outputs.chart_names }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bot_id="$(gh api /users/github-actions%5Bbot%5D --jq '.id')"

          git config user.name "github-actions[bot]"
          git config user.email "${bot_id}+github-actions[bot]@users.noreply.github.com"

          git add "$TRACKED_CHARTS_DIR"

          if git diff --cached --quiet; then
            echo "No chart changes to commit"
            exit 0
          fi

          git commit -m "chore: extract chart source for ${CHART_NAMES}"
          git push
